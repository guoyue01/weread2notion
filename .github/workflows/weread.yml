name: weread sync

on:
  workflow_dispatch:
    inputs:
      full_sync:
        description: "强制全量同步，补齐已有书籍的新字段"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 0 * * *"

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: WeRead to Notion
        uses: ./
        with:
          weread-api-key: ${{ secrets.WEREAD_API_KEY }}
          notion-token: ${{ secrets.NOTION_TOKEN }}
          notion-page: ${{ secrets.NOTION_PAGE }}
          notion-database-id: ${{ secrets.NOTION_DATABASE_ID }}
          notion-data-source-id: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          full-sync: ${{ github.event_name == 'workflow_dispatch' && inputs.full_sync || false }}
